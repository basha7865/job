{% extends 'jobs/base.html' %}

{% block title %}Delete Job Posting | JobPortal{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm p-4">
            <div class="card-body text-center">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-danger bg-opacity-10 p-3 mb-3 text-danger">
                    <i class="fa-solid fa-triangle-exclamation fa-2x"></i>
                </div>
                <h3 class="fw-bold">Confirm Deletion</h3>
                <p class="text-muted">Are you sure you want to delete the job posting for <strong>{{ job.title }}</strong>? This action cannot be undone.</p>
                
                <form method="POST" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex gap-3 justify-content-center">
                        <a href="{% url 'job_detail' job.id %}" class="btn btn-outline-secondary px-4 fw-semibold">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4 fw-semibold">
                            <i class="fa-solid fa-trash me-1"></i> Delete Job
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
